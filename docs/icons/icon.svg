<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#5b4de0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0eeff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- schedule card -->
  <g>
    <rect x="96" y="150" width="270" height="230" rx="28" fill="url(#card)"/>
    <!-- card header strip -->
    <rect x="96" y="150" width="270" height="54" rx="28" fill="#ffffff" fill-opacity="0"/>
    <rect x="96" y="150" width="270" height="60" fill="#5b4de0"/>
    <rect x="96" y="150" width="270" height="60" rx="28" fill="#5b4de0"/>
    <rect x="96" y="180" width="270" height="30" fill="#5b4de0"/>
    <!-- binder rings -->
    <rect x="150" y="130" width="18" height="46" rx="9" fill="#2f2470"/>
    <rect x="294" y="130" width="18" height="46" rx="9" fill="#2f2470"/>

    <!-- shift chips grid: 3 columns x 2 rows -->
    <g>
      <rect x="122" y="232" width="58" height="28" rx="9" fill="#f0a830"/>
      <rect x="196" y="232" width="58" height="28" rx="9" fill="#38a8f0"/>
      <rect x="270" y="232" width="58" height="28" rx="9" fill="#e6e6f5"/>

      <rect x="122" y="278" width="58" height="28" rx="9" fill="#e6e6f5"/>
      <rect x="196" y="278" width="58" height="28" rx="9" fill="#a070f8"/>
      <rect x="270" y="278" width="58" height="28" rx="9" fill="#f0a830"/>

      <rect x="122" y="324" width="58" height="28" rx="9" fill="#38a8f0"/>
      <rect x="196" y="324" width="58" height="28" rx="9" fill="#e6e6f5"/>
      <rect x="270" y="324" width="58" height="28" rx="9" fill="#a070f8"/>
    </g>
  </g>

  <!-- alarm bell badge -->
  <g transform="translate(336,286)">
    <circle cx="60" cy="60" r="86" fill="#ff6a5c"/>
    <circle cx="60" cy="60" r="86" fill="none" stroke="#5b4de0" stroke-width="10" opacity="0"/>
    <g fill="#ffffff">
      <path d="M60 22c-24 0-42 19-42 42v18l-13 20c-2 4 1 8 5 8h100c4 0 7-4 5-8l-13-20V64c0-23-18-42-42-42z"/>
      <circle cx="60" cy="118" r="11"/>
      <rect x="52" y="10" width="16" height="16" rx="8"/>
    </g>
  </g>
</svg>
